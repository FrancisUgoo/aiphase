[project]
name = "aiphase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FrancisUgoo", email = "109428450+FrancisUgoo@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "gitsource>=0.0.5",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
aiphase = "aiphase:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
